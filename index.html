<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171421" />
    <meta
      name="description"
      content="You Are the Soccer Ball, a small browser juggling game."
    />
    <title>You Are the Soccer Ball</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="cursor.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="game-card" aria-labelledby="game-title">
        <header class="game-header">
          <h1 id="game-title">You Are the Soccer Ball</h1>

          <div class="toolbar" aria-label="Game controls">
            <button id="restart-button" class="icon-button" type="button" title="Restart">
              <span aria-hidden="true">↻</span>
              <span class="button-label">Restart</span>
            </button>
            <button
              id="mute-button"
              class="icon-button"
              type="button"
              aria-pressed="false"
              title="Mute music"
            >
              <span id="mute-icon" aria-hidden="true">♪</span>
              <span id="mute-label" class="button-label">Audio on</span>
            </button>
          </div>
        </header>

        <div id="game-stage" class="game-stage">
          <canvas
            id="game-canvas"
            width="960"
            height="600"
            tabindex="0"
            aria-label="Game area. Kick the stationary ball upward, then time each descending kick."
          ></canvas>

          <div id="game-overlay" class="game-overlay" aria-hidden="false">
            <div class="overlay-card">
              <p id="overlay-kicker" class="overlay-kicker">Goal: 100</p>
              <h2 id="overlay-title">Keep the ball in the air</h2>
              <p id="overlay-copy">Kick the stationary ball upward, then time each descending kick.</p>
              <button id="overlay-action" class="primary-button" type="button" hidden>
                Try again
              </button>
            </div>
          </div>
        </div>

        <div class="sr-only" aria-live="polite" aria-atomic="true">
          <p id="score-announcement">Score 0.</p>
          <p id="state-announcement">Game ready.</p>
        </div>

        <p class="music-credit">
          Music from <cite>Endacopia</cite> ©
          <a href="https://andyl4nd.itch.io/" target="_blank" rel="noopener noreferrer">
            AndyL4nd
          </a>
          — All rights reserved.
        </p>
      </section>
    </main>

    <noscript>JavaScript must be enabled in your browser to play.</noscript>
    <script type="module" src="src/game.js"></script>
  </body>
</html>
